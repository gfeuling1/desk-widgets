# Builds the Windows installer on GitHub's servers and attaches it to a release.
# Run it from the Actions tab (Release > Run workflow) after bumping the version
# in package.json, src-tauri/tauri.conf.json, and src-tauri/Cargo.toml.
name: Release

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write # lets the job create the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Desk Widgets v__VERSION__
          releaseBody: |
            Download the file ending in **x64-setup.exe** under Assets and run it.
            Windows may show a SmartScreen warning because the app isn't code-signed: click **More info**, then **Run anyway**.
          releaseDraft: true
          prerelease: false
